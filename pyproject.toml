[project]
name = "pdfm"
version = "0.1.0"
description = "Static analysis toolkit for malicious PDF files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pikepdf>=9.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
sandbox = ["mini-racer>=0.12"]  # JavaScript emulation in an isolated V8
yara = ["yara-python>=4.3"]
all = ["mini-racer>=0.12", "yara-python>=4.3"]
dev = ["pytest>=8.0", "mini-racer>=0.12", "yara-python>=4.3"]

[project.scripts]
pdfm = "pdfm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
