[project]
name = "pdfm"
version = "0.1.0"
description = "Static analysis toolkit for malicious PDF files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon Karimi" }]
keywords = ["pdf", "malware", "malware-analysis", "phishing", "yara", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.11"
dependencies = [
    "pikepdf>=9.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
sandbox = ["mini-racer>=0.12"]  # JavaScript emulation in an isolated V8
yara = ["yara-python>=4.3"]
qr = ["opencv-python-headless>=4.8", "numpy>=1.24"]  # QR-code decoding in page images
all = ["mini-racer>=0.12", "yara-python>=4.3", "opencv-python-headless>=4.8", "numpy>=1.24"]
dev = ["pytest>=8.0", "mini-racer>=0.12", "yara-python>=4.3", "opencv-python-headless>=4.8", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/brandonkarimi/pdfm"
Evaluation = "https://github.com/brandonkarimi/pdfm/blob/main/docs/EVALUATION.md"

[project.scripts]
pdfm = "pdfm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
